<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<meta name="text-scale" content="scale" />
		<script>
			// Apply dark mode before the first paint: the stored choice (see
			// src/lib/theme.ts), or else the system preference.
			try {
				const stored = localStorage.getItem('theme');
				const system = matchMedia('(prefers-color-scheme: dark)').matches;
				if (stored ? stored === 'dark' : system) document.documentElement.classList.add('dark');
			} catch {
				// Storage is unavailable: stay in light mode.
			}
		</script>
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
